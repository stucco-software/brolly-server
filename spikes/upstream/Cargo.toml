[package]
name = "spike-upstream"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "THROWAWAY. Proves the upstream crates work end to end before we commit to them (open decision O1). Delete once the ADR lands."

[dependencies]
activitypub_federation = "0.7.0-beta.11"
anyhow = "1.0.104"
async-trait = "0.1.92"
atrium-api = "0.25.8"
atrium-common = "0.1.4"
atrium-crypto = "0.1.3"
atrium-identity = "0.1.9"
atrium-repo = "0.1.8"
atrium-xrpc = "0.12.4"
chrono = "0.4.45"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"

# `activitypub_federation` was deliberately removed after the probe. It is
# AGPL-3.0 and pulls RUSTSEC-2023-0071; keeping it in the tree while ADR 0003 is
# open would both fail `cargo deny` and pre-empt a decision that is not ours.
# ADR 0003 records the exact versions so the finding is reproducible.
#
# Deliberately NOT `[lints] workspace = true`. A spike prints its findings and
# unwraps freely; holding it to library standards would make it slower to write
# and would not make the ADR more correct.
