[package]
name = "brolly-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Composes the adapters, owns app(), spawns workers. The only crate depending on more than one adapter."

[lib]
name = "brolly_server"
path = "src/lib.rs"

[[bin]]
name = "brolly-server"
path = "src/main.rs"

[dependencies]
brolly-domain.workspace = true
brolly-store.workspace = true
brolly-authz.workspace = true
brolly-identity.workspace = true
brolly-solid.workspace = true
brolly-atproto.workspace = true
brolly-activitypub.workspace = true
brolly-mastodon.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
askama = "0.14"
tower-http = { version = "0.7.0", features = ["fs"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
time = "0.3.55"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate"] }

[dev-dependencies]
brolly-solid.workspace = true
brolly-store.workspace = true
brolly-test-support.workspace = true
http-body-util = "0.1.5"
oxigraph = "0.5.9"
tempfile = "3.27.0"
time = "0.3.55"
toml = "0.8"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
