[package]
name = "brolly-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Composes the adapters, owns app(), spawns workers. The only crate depending on more than one adapter."

[lib]
name = "brolly_server"
path = "src/lib.rs"

[[bin]]
name = "brolly-server"
path = "src/main.rs"

# Operational commands. A separate binary rather than a subcommand of the
# server, so running one cannot accidentally start the other.
[[bin]]
name = "brolly-admin"
path = "src/bin/admin.rs"

[dependencies]
brolly-domain.workspace = true
brolly-store.workspace = true
brolly-authz.workspace = true
brolly-identity.workspace = true
brolly-solid.workspace = true
brolly-atproto.workspace = true
brolly-activitypub.workspace = true
brolly-mastodon.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
# Named only to implement `http_body::Body` for a 304's empty body, whose size
# must stay unannounced (`server/src/pod.rs`, `NotModifiedBody`). The same 1.x
# copy axum and hyper already link.
http-body = "1.1"
tokio = { version = "1.53.1", features = ["full"] }
askama = "0.14"
tower-http = { version = "0.7.0", features = ["fs"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
time = "0.3.55"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate"] }
serde_json = "1.0.151"
form_urlencoded = "1.2"
serde_urlencoded = "0.7"
# `rustls-no-provider`, not `rustls`: the latter compiles aws-lc-rs, a second C
# build next to RocksDB. Without a provider, building a Client panics, so both
# binaries call `tls::install_crypto_provider()` first. Roots come from
# rustls-platform-verifier (the OS store; `ca-certificates` in the image).
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
# Named directly only to reach `rustls::crypto::ring` and install it as the
# process-wide provider (server/src/tls.rs). It resolves to the same 0.23 copy
# reqwest and sqlx already link, and ring 0.17 is already in the tree. The
# `rustls` reqwest feature would pull in aws-lc-rs and a second C build instead.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
atrium-repo = "0.1.8"
# Only for the alt-text triple; the engine otherwise stays inside brolly-store.
oxigraph_model = { package = "oxrdf", version = "0.3" }
url = "2.5.8"
sha2 = "0.11.0"
base64 = "0.23.1"
uuid = { version = "1.25.0", features = ["v4"] }
# Client metadata cache for ATProto PAR. `future` because lookups happen
# inside handlers; store already takes moka with `sync`, and the two unify.
moka = { version = "0.12.16", features = ["future"] }

[dev-dependencies]
brolly-solid.workspace = true
brolly-mastodon.workspace = true
brolly-atproto.workspace = true
rs-car-sync = "0.5.1"
# A real websocket client: `oneshot` cannot complete an upgrade, so the
# firehose has to be driven over an actual socket to be tested at all.
tokio-tungstenite = "0.24"
futures-util = "0.3"
brolly-activitypub.workspace = true
brolly-identity.workspace = true
brolly-store = { workspace = true, features = ["test-fixtures"] }
brolly-test-support.workspace = true
http-body-util = "0.1.5"
oxigraph = "0.5.9"
tempfile = "3.27.0"
time = "0.3.55"
toml = "0.8"
tower = { version = "0.5.3", features = ["util"] }
form_urlencoded = "1.2"
p256 = { version = "0.14.0", features = ["ecdsa"] }
sha2 = "0.11.0"
base64 = "0.23.1"
uuid = { version = "1.25.0", features = ["v4"] }
serde_json = "1.0.151"
# A throwaway CA and a leaf for `localhost`, generated on every run, so the TLS
# handshake test has no fixture to expire. `ring`, not the default aws-lc-rs,
# so it adds no C build.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }

[lints]
workspace = true
