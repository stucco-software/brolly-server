{# Partial: the console's section nav. No <h1> — each page owns its own. #}
<nav class="dashboard-tabs" aria-label="Admin sections">
  <ul>
    {% for tab in tabs %}
    <li>
      <a href="{{ tab.href }}"{% if tab.current %} aria-current="page"{% endif %}>{{ tab.label }}</a>
    </li>
    {% endfor %}
  </ul>
</nav>
