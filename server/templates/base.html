<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ chrome.instance_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/brolly.css">
  <link rel="icon" type="image/png" sizes="96x96" href="/static/favicon/favicon-96x96.png">
  <link rel="shortcut icon" href="/static/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% block header %}
  <header class="shell-header">
    <div class="wrap shell-header-inner">
      <a class="brand" href="/">{{ chrome.instance_name }}</a>
      <nav class="shell-nav" aria-label="Primary">
        {% block nav %}{% endblock %}
      </nav>
    </div>
  </header>
  {% endblock %}
  <main id="main" class="shell-main">
    {% block content %}{% endblock %}
  </main>
  {% block footer %}
  <footer class="shell-footer">
    <div class="wrap">
      <p class="fine-print">{% include "_fine_print.html" %}</p>
      <p class="footer-fine">Your data lives in your pod. Take it with you whenever you like.</p>
    </div>
  </footer>
  {% endblock %}
</body>
</html>
