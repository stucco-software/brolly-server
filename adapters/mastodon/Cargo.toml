[package]
name = "brolly-mastodon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Mastodon Client API. Projection only — no store writes, no sibling-adapter deps."

[dependencies]
brolly-domain.workspace = true
brolly-store.workspace = true
brolly-authz.workspace = true
brolly-identity.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.25.0", features = ["v4"] }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
rand = "0.10.2"
tracing.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
brolly-activitypub.workspace = true

[lints]
workspace = true
