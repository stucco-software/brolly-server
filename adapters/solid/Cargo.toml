[package]
name = "brolly-solid"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Solid: LDP-RS/-NR/-BC, N3 Patch, SPARQL Update PATCH, Solid-OIDC."

[dependencies]
brolly-domain.workspace = true
brolly-store.workspace = true
brolly-authz.workspace = true
brolly-identity.workspace = true
oxigraph = "0.5.9"
uuid = { version = "1.25.0", features = ["v4"] }
oxttl = "0.2.3"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
