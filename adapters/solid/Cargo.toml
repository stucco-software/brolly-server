[package]
name = "brolly-solid"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Solid: LDP-RS/-NR/-BC, N3 Patch, SPARQL Update PATCH, Solid-OIDC."

[dependencies]
brolly-domain.workspace = true
brolly-store.workspace = true
brolly-authz.workspace = true
brolly-identity.workspace = true
oxigraph = "0.5.9"
# The SPARQL algebra oxigraph parses into, so the patch path can classify and
# allow-list a *parsed* update rather than pattern-match its bytes (spec 5c,
# H5 and H7). Already in the tree as oxigraph's own parser.
spargebra = "0.4.6"
uuid = { version = "1.25.0", features = ["v4"] }
oxttl = "0.2.3"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
rand = "0.10.2"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "uuid", "time"] }

[lints]
workspace = true

[dev-dependencies]
brolly-store = { workspace = true, features = ["test-fixtures"] }
tempfile = "3.27.0"
brolly-test-support.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
