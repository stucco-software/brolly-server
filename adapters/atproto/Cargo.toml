[package]
name = "brolly-atproto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ATProtocol: XRPC, MST/repo/CAR via atrium, PLC, OAuth, firehose."

[dependencies]
brolly-domain.workspace = true
brolly-store.workspace = true
brolly-authz.workspace = true
brolly-identity.workspace = true
# ADR 0002, at the versions its spike actually exercised. No hand-rolled MST,
# CAR, commit signing or did:key (D14) — the predecessor's was the single
# largest source of "works until it meets a real client".
atrium-api = "0.25.8"
atrium-common = "0.1.4"
atrium-crypto = "0.1.3"
atrium-identity = "0.1.9"
atrium-repo = "0.1.8"
atrium-xrpc = "0.12.4"
# The record value as it is stored: DAG-CBOR with CID links. The same copy
# atrium-api and serde_ipld_dagcbor already link, named directly because a
# `$blob` ref has to be built as an `Ipld::Link` and no crate re-exports the
# type (1, H).
ipld-core = "0.4"
# The commit envelope's `sig` field is a CBOR byte string, and atrium's own
# schema serializes it with `serde_bytes` — the same copy atrium-repo links,
# named so the envelope's bytes cannot drift from its (1, B).
serde_bytes = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# client_id and redirect_uri checks are URL-structural (host kind, port,
# userinfo, origin); string prefixes are how is_valid_client_id went wrong.
url = "2.5.8"
sha2 = "0.11.0"
oxigraph = "0.5.9"
# The DID is derived from the DAG-CBOR of the genesis operation, so the same
# encoder atrium uses is the one that has to produce it.
serde_ipld_dagcbor = "0.6"
base32 = "0.5"
time = "0.3.55"
base64 = "0.23.1"
# 0.13 rather than a third version: the tree already carries 0.13 (via the
# ActivityPub stack) and 0.14. `multiple-versions` is a warning, not a licence
# to keep adding.
# `rustls-no-provider`: PLC submission is https-only, and without a TLS feature
# every request to plc.directory failed. This crate builds no Client itself.
# The binary that passes one in installs the crypto provider (server/src/tls.rs).
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rand = "0.8"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "io-util"] }
tracing.workspace = true
uuid = { version = "1.25.0", features = ["v4"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "uuid", "time", "json"] }

[dev-dependencies]
tempfile = "3.27.0"
# Phase 7 exit criterion: the CAR must validate against an implementation that
# is **not** atrium, or the test only proves atrium agrees with itself.
rs-car-sync = "0.5.1"
atrium-repo = "0.1.8"
sha2 = "0.11.0"
brolly-test-support.workspace = true
uuid = { version = "1.25.0", features = ["v4"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
