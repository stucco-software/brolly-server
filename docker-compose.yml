# The whole stack, on OrbStack's HTTPS domains.
#
# OrbStack issues a trusted certificate for a container's declared domains —
# **including wildcards** — and proxies to it with the `Host` header intact.
# That last part is what makes it work here at all: brolly's router branches on
# `Host` to tell the instance from a member's pod, so a proxy that rewrote it
# would collapse every member onto the apex.
#
# It also removes three steps that used to be required: mkcert, a Caddy
# terminator, and `/etc/hosts` entries per member. Nothing is generated and
# nothing is installed into a system trust store beyond what OrbStack already
# did.
#
# One interaction to know about: the test suite provisions its own Postgres
# through testcontainers and competes with this stack for the daemon. On a
# constrained machine that produces `WaitContainer(StartupTimeout)` failures
# that read exactly like real ones. `docker compose down` before a full run.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brolly
    # Published on 5544 so `brolly-admin` and psql can reach it from the host.
    # Not 5432: a developer machine usually already has a Postgres, and
    # silently connecting to the wrong one is a bad afternoon.
    ports:
      - "5544:5432"
    volumes:
      - brolly-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  brolly:
    build:
      context: .
    labels:
      # The apex and every member subdomain. The wildcard is not a convenience:
      # each member lives on their own host, so without it only the instance
      # itself would be reachable.
      dev.orbstack.domains: "brolly.local,*.brolly.local"
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/brolly"
      # Must match the domains above. Every WebID, actor IRI, OAuth issuer and
      # DPoP `htu` is built from it, so a mismatch fails every proof and every
      # identity while the server otherwise looks healthy.
      BROLLY_BASE_DOMAIN: "brolly.local"
      RUST_LOG: "info"
      # PLC submission stays off: a development instance should not publish
      # test identities to the real directory. Identities are still minted
      # locally and wait in `brolly-admin plc-retry` (ADR 0016).
      BROLLY_PLC_SUBMIT: "0"
      # An app in front of the instance (StuccoID), off by default. See
      # "An app in front" in docs/deploying.md. The service token mounts
      # /internal/v1/ and must be 32+ characters (`openssl rand -hex 32`);
      # the URLs must be absolute. Claim the instance with the bootstrap
      # invite *before* setting BROLLY_SIGNUP_URL: it closes /register.
      # BROLLY_SERVICE_TOKEN: "replace-with-openssl-rand-hex-32-output"
      # BROLLY_HOME_URL: "http://localhost:5173/"
      # BROLLY_SIGNUP_URL: "http://localhost:5173/account/create"
      # BROLLY_ACCOUNT_HOME: "http://localhost:5173/profile"
    volumes:
      - brolly-data:/var/lib/brolly
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  brolly-pg:
  brolly-data:
