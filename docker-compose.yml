# Local development dependencies.
#
# The test suite does **not** use this — it provisions its own Postgres through
# testcontainers so a clean clone needs no setup. This is for running the
# server, which needs a database that outlives a single `cargo test`.
#
# One consequence worth knowing: testcontainers competes with these for the
# Docker daemon. On a constrained machine, running the suite while this stack is
# up produces `WaitContainer(StartupTimeout)` failures that look exactly like
# real test failures. `docker compose down` before a full test run.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brolly
    # 5544, not 5432: a developer machine usually already has a Postgres, and
    # silently connecting to the wrong one is a bad afternoon.
    ports:
      - "5544:5432"
    volumes:
      - brolly-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  # TLS termination. The authenticated surface cannot be exercised over plain
  # HTTP — the session cookie is `Secure` and every URL the server builds is
  # `https://`, including the `htu` a DPoP proof is checked against.
  #
  # Requires certificates first:
  #   mkcert -cert-file tls/cert.pem -key-file tls/key.pem "brolly.test" "*.brolly.test"
  #
  # Started only with `--profile tls`, so `docker compose up` works before the
  # certificates exist.
  caddy:
    image: caddy:2
    profiles: ["tls"]
    ports:
      - "8443:443"
    volumes:
      - ./tls:/tls:ro
      - ./tls/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  brolly-pg:
