[advisories]
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071 — Marvin attack, timing sidechannel in the `rsa` crate.
  #
  # Accepted, not ignored casually:
  #   * There is no fixed release. The advisory has been open since 2023 and the
  #     only remediation upstream offers is "do not use this crate".
  #   * It arrives transitively via activitypub_federation, which needs RSA for
  #     cavage HTTP signatures. Every major fediverse implementation in Rust
  #     carries the same exposure, as did our own predecessor.
  #   * Exploitation requires an attacker able to induce and finely time many
  #     private-key operations. Our RSA private-key use is outbound delivery
  #     signing, not a decryption oracle.
  #
  # Review trigger: re-evaluate if `rsa` ships a fix, if we gain an inbound path
  # that performs RSA decryption, or by 2027-08-18 — whichever comes first.
  "RUSTSEC-2023-0071",

  # RUSTSEC-2026-0194 / RUSTSEC-2026-0195 — quadratic parse and unbounded
  # namespace allocation in quick-xml 0.37.5, both denial-of-service class.
  #
  # Paired with a real mitigation, not waved through: we never parse RDF/XML
  # from network input, so the vulnerable code is unreachable from untrusted
  # data. See ADR 0007 — Phase 4 rejects `application/rdf+xml` on every write
  # path with 415, and a test asserts it.
  #
  # Not fixable by us: quick-xml 0.37.5 is the newest in its line, pinned by
  # oxrdfxml <- oxrdfio <- oxigraph, and RDF/XML is not an optional feature.
  #
  # Review trigger: any oxigraph bump. If it accepts a fixed quick-xml, drop
  # these and reconsider accepting RDF/XML on input.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path dependencies carry no version requirement, which
# cargo-deny reads as a wildcard. They are not third-party risk.
allow-wildcard-paths = true

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # webpki-roots ships the Mozilla CA bundle under a permissive data license.
  "CDLA-Permissive-2.0",
  # brolly itself is AGPL-3.0-or-later (ADR 0003), so the copyleft family in
  # the ActivityPub stack is compatible rather than merely tolerated.
  # Our own crates declare AGPL-3.0-or-later; the AP stack declares the
  # bare/older forms. SPDX treats these as distinct expressions, so list each.
  "AGPL-3.0-or-later",
  "AGPL-3.0",
  "GPL-3.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
