[workspace]
resolver = "3"
members = [
  "domain",
  "store",
  "authz",
  "identity",
  "adapters/solid",
  "adapters/atproto",
  "adapters/activitypub",
  "adapters/mastodon",
  "server",
  "test-support",
  # Throwaway; removed when open decision O1 is closed.
  "spikes/upstream",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
# AGPL-3.0: brolly is a public good. The network clause is the point —
# operators who modify it owe their users the source. See ADR 0003.
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
brolly-domain       = { path = "domain" }
brolly-store        = { path = "store" }
brolly-authz        = { path = "authz" }
brolly-identity     = { path = "identity" }
brolly-solid        = { path = "adapters/solid" }
brolly-atproto      = { path = "adapters/atproto" }
brolly-activitypub  = { path = "adapters/activitypub" }
brolly-mastodon     = { path = "adapters/mastodon" }
brolly-test-support = { path = "test-support" }

tracing = "0.1"

# Phase 0 keeps external deps minimal on purpose. Protocol crates take their
# dependencies when their phase starts (see docs/greenfield-implementation-plan.md §3).

# Dependencies get no debug info. RocksDB alone was two 947 MB rlibs plus 6 GB
# of C++ objects in a 15 GB debug target, and we never step through it. Our own
# crates keep full debug info, so breakpoints and backtraces in brolly-* are
# unaffected.
[profile.dev.package."*"]
debug = false

# atrium-repo 0.1.8's `split_subtree` silently drops a parent node's entries
# when the level below splits with one side empty, losing records from the
# tree (a delete/re-add round trip makes every key on that side unfindable).\n# Vendored with that one fix until an upstream release carries it; the patch
# is marked in vendor/atrium-repo/src/mst.rs.
[patch.crates-io]
atrium-repo = { path = "vendor/atrium-repo" }

[workspace.lints.clippy]
# Deny, not warn. Warn was not enough last time — see learnings §2.10.
unwrap_used  = "deny"
expect_used  = "deny"
panic        = "deny"
todo         = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro    = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
